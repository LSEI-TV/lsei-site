name: Build & Deploy vers OVH

# Quand se déclenche le déploiement automatique :
on:
  push:
    branches: [ main ]          # à chaque modif envoyée sur GitHub
  schedule:
    - cron: '0 4 * * *'         # chaque nuit à 04h00 UTC (06h en France l'été) → rafraîchit les vidéos YouTube
  workflow_dispatch:            # bouton "Run workflow" pour lancer à la demande

# Empêche deux déploiements de tourner en même temps.
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Créer le fichier .env (clé YouTube)
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
          echo "YOUTUBE_CHANNEL_ID=UCYUOdKr28cOjLzHWv6pTpjQ" >> .env

      - name: Construire le site
        run: npm run build

      - name: Déployer sur OVH par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /site/
